[project]
name = "ida-mcp"
version = "20261008.0.1"
description = "Official Hex-Rays IDA MCP Server."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "packaging",
    "ida-nexus==0.13.4+ida80.1",
    "ida-domain[idalib]==0.5.1+ida80.1",
    "zeromcp>=1.10.3",
]

# The upstream packages require newer IDA SDKs. Always use the reviewed
# compatibility forks when installing this checkout with uv.
[tool.uv.sources]
ida-nexus = { path = "vendor/ida-nexus", editable = true }
ida-domain = { path = "vendor/ida-domain", editable = true }

[project.urls]
Repository = "https://github.com/HexRaysSA/ida-mcp"
Issues = "https://github.com/HexRaysSA/ida-mcp/issues"

[project.scripts]
ida-mcp = "ida_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.12.0",
    "ty>=0.0.83",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["ida_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
